name: Content Validation CI

on:
  push:
    paths:
      - 'src/main/resources/**'
      - '.schema/**'
  pull_request:
    paths:
      - 'src/main/resources/**'
      - '.schema/**'

jobs:
  validate:
    name: Validate Content Schemas and References
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Content Validator
        run: ./gradlew validateContent
