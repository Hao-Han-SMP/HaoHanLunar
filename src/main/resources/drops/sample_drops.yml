# =========================================================
# HaoHanLunar - Sample Drop Table Definition
# =========================================================
config-version: 1
id: sample_lunar_drops

# Number of loot rolls evaluated on death
rolls: 2

# Roll mode: independent (each entry evaluated by chance) or weighted (1-of-N pool)
mode: independent

# List of drop entries
entries:
  - item: haohan:aero_compound
    chance: 0.75
    min: 1
    max: 3
  - item: haohan:raw_anorthosite
    chance: 1.0
    min: 2
    max: 5
